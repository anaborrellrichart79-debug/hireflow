# Publica SOLO la Política de Privacidad en GitHub Pages, para tener la URL
# pública que exige Google Play (ver docs/decisions.md, entrada 035).
# No publica la app ni el resto del repositorio: copia a _site únicamente la
# página y los archivos que necesita.
name: Política de Privacidad (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - frontend/privacy.html
      - frontend/js/privacyPage.js
      - frontend/js/privacyPolicyContent.js
      - frontend/js/publicPage.js
      - frontend/delete-account.html
      - frontend/js/deleteAccountPage.js
      - frontend/js/deleteAccountContent.js
      - frontend/style/privacy.css
      - frontend/404.html
      - frontend/js/notFoundPage.js
      - frontend/js/components/lostMascot.js
      - frontend/js/i18n.js
      - frontend/style/notfound.css
      - frontend/assets/mascota-soporte.svg
      - .github/workflows/privacy-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-page
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar solo los archivos de la política y la página 404
        run: |
          mkdir -p _site/js/components _site/style _site/assets/icons
          # Sin la <meta name="hireflow-app">: en Pages no hay app a la que
          # volver, así que la página no muestra "Volver a HireFlow"
          sed '/<meta name="hireflow-app"/d' frontend/privacy.html > _site/privacy.html
          ! grep -q 'name="hireflow-app"' _site/privacy.html
          # La raíz de la web también muestra la política
          cp _site/privacy.html _site/index.html
          cp frontend/js/privacyPage.js frontend/js/privacyPolicyContent.js frontend/js/publicPage.js _site/js/
          # "Cómo eliminar tu cuenta": el enlace web que pide Google Play
          sed '/<meta name="hireflow-app"/d' frontend/delete-account.html > _site/delete-account.html
          ! grep -q 'name="hireflow-app"' _site/delete-account.html
          cp frontend/js/deleteAccountPage.js frontend/js/deleteAccountContent.js _site/js/
          cp frontend/style/privacy.css _site/style/
          cp frontend/assets/icons/favicon.svg _site/assets/icons/
          # 404: GitHub Pages la sirve para cualquier ruta desconocida. Sus
          # rutas cuelgan de <base href="/">; aquí la web vive en /hireflow/
          sed 's#<base href="/">#<base href="/hireflow/">#' frontend/404.html > _site/404.html
          grep -q '<base href="/hireflow/">' _site/404.html
          cp frontend/js/notFoundPage.js frontend/js/i18n.js _site/js/
          cp frontend/js/components/lostMascot.js _site/js/components/
          cp frontend/style/notfound.css _site/style/
          cp frontend/assets/mascota-soporte.svg _site/assets/
          find _site -type f

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
